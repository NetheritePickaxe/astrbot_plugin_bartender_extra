<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>酒馆控制面板</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panel">
      <div class="panel-header">
        <h1>酒馆控制面板</h1>
        <div class="status-row">
          <span id="dot" class="dot unknown"></span>
          <span id="status-text" class="status-label">检测中…</span>
          <code id="addr" class="addr">—</code>
          <button id="copy" class="btn-icon" type="button" title="复制地址">复制</button>
          <button id="refresh" class="btn-icon" type="button" title="刷新状态">刷新</button>
        </div>
      </div>
      <div class="card-grid">
        <div class="card">
          <div class="card-label">酒馆控制</div>
          <div class="card-desc">根据酒馆运行状态执行启动、关闭或重启</div>
          <div class="dropdown" id="st-dd">
            <div class="split-group">
              <button id="st-execute" class="card-btn primary" disabled>启动</button>
              <button id="st-dd-toggle" class="card-btn primary split-caret hidden" type="button">▼</button>
            </div>
            <div id="st-dd-menu" class="dropdown-menu hidden">
              <button type="button" class="dropdown-item" data-action="restart">重启</button>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-label">外部打开</div>
          <div class="card-desc">在新标签页中打开 SillyTavern 界面</div>
          <button id="ext-tag" class="card-btn" disabled>打开</button>
        </div>
      </div>
      <div class="section-title">安装卸载</div>
      <div class="card-grid">
        <div class="card">
          <div class="card-label">安装酒馆</div>
          <div class="card-desc">下载并安装最新版 SillyTavern</div>
          <button id="install" class="card-btn primary" disabled>安装</button>
        </div>
        <div class="card">
          <div class="card-label">卸载酒馆</div>
          <div class="card-desc">删除所有角色、聊天记录和配置</div>
          <button id="uninstall" class="card-btn" disabled>卸载</button>
        </div>
      </div>
      <div class="section-title">数据管理</div>
      <div class="card-grid">
        <div class="card">
          <div class="card-label">导入数据</div>
          <div class="card-desc">上传 zip 文件恢复酒馆数据</div>
          <button id="import-btn" class="card-btn" disabled>导入</button>
          <input type="file" id="import-file" accept=".zip" hidden />
        </div>
        <div class="card">
          <div class="card-label">导出整库备份</div>
          <div class="card-desc">打包内置酒馆 data 目录为 zip 下载</div>
          <button id="export-data" class="card-btn" disabled>导出</button>
        </div>
      </div>
      <div id="message" class="message hidden"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
