<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>酒馆控制面板</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="panel">
      <div class="panel-header">
        <h1>酒馆控制面板</h1>
        <div class="status-row">
          <span id="dot" class="dot unknown"></span>
          <span id="status-text" class="status-label">检测中…</span>
          <code id="addr" class="addr">—</code>
          <button id="copy" class="btn-icon" type="button" title="复制地址">复制</button>
        </div>
      </div>
      <div id="btn-grid" class="btn-grid">
        <button id="start" class="btn primary hidden">启动酒馆</button>
        <button id="install" class="btn primary hidden">安装酒馆</button>
        <button id="stop" class="btn hidden">关闭酒馆</button>
        <button id="restart" class="btn hidden">重启酒馆</button>
        <button id="ext-tag" class="btn hidden">打开外部酒馆</button>
        <button id="export-data" class="btn hidden">导出整库备份</button>
        <button id="refresh" class="btn hidden">刷新状态</button>
      </div>
      <div id="message" class="message hidden"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
